name: Build APK Termux Indonesia

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Pasang komponen Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"
          sdkmanager --install "ndk;29.0.14206865"

      - name: Berikan izin Gradle
        run: chmod +x gradlew

      - name: Bangun APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Termux-Indonesia-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
